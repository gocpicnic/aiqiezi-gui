name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux GUI dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Set build metadata
        shell: bash
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          cli_rev=$(sed -n 's/.*rev = "\([a-f0-9][a-f0-9]*\)".*/\1/p' Cargo.toml | head -n 1)
          test -n "$cli_rev"
          echo "CLI_REV=$cli_rev" >> "$GITHUB_ENV"
      - name: Build GUI
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '10.15' || '' }}
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p aiqiezi-gui
      - name: Build bundled client daemon
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '10.15' || '' }}
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo install \
            --git https://github.com/gocpicnic/aiqiezi-cli \
            --rev "$CLI_REV" \
            --bin aiqiezi \
            --root staging/cli \
            --locked \
            --target "${{ matrix.target }}"
      - name: Verify bundled client daemon (Unix)
        if: runner.os != 'Windows'
        run: ./staging/cli/bin/aiqiezi --version
      - name: Verify bundled client daemon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\staging\cli\bin\aiqiezi.exe --version
      - name: Stage release files (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/aiqiezi-gui" artifacts/
          cp staging/cli/bin/aiqiezi artifacts/
          cp LICENSE artifacts/
      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aiqiezi-gui.exe" artifacts/
          Copy-Item "staging\cli\bin\aiqiezi.exe" artifacts/
          Copy-Item LICENSE artifacts/
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aiqiezi-gui-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Package artifacts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/aiqiezi-gui-*; do
            target="${dir#artifacts/aiqiezi-gui-}"
            if [[ "$target" == *windows* ]]; then
              (cd "$dir" && zip -q -j "../../release/aiqiezi-gui-${version}-${target}.zip" aiqiezi-gui.exe aiqiezi.exe LICENSE)
            else
              tar -czf "release/aiqiezi-gui-${version}-${target}.tar.gz" -C "$dir" .
            fi
          done
          (cd release && sha256sum * > SHA256SUMS)
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "aiqiezi-gui ${GITHUB_REF_NAME#v}. Includes the bundled aiqiezi client daemon. Binaries are unsigned; installers, signing, and notarization are not provided yet."
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
