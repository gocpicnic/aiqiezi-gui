[package]
name = "aiqiezi-gui"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0"
description = "Native desktop client for the self-hosted aiqiezi-server photo/video archive"
repository = "https://github.com/gocpicnic/aiqiezi-gui"
build = "build.rs"

[dependencies]
aiqiezi-client = { git = "https://github.com/gocpicnic/aiqiezi-cli", rev = "7e2a5e19681948595afa11d7f54b05003a333121" }
anyhow = "1"
arboard = "3.7"
eframe = { version = "0.37", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
