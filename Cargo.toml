[package]
name = "aiqiezi-gui"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0"
description = "Native desktop client for the self-hosted aiqiezi-server photo/video archive"
repository = "https://github.com/gocpicnic/aiqiezi-gui"
build = "build.rs"

[dependencies]
aiqiezi-client = { git = "https://github.com/gocpicnic/aiqiezi-cli", rev = "664e72fe41f45d3934602e988864cae9aab40cf2" }
anyhow = "1"
arboard = "3.7"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "wayland",
    "wgpu",
    "x11",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
