[package]
name = "aiqiezi-gui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Native desktop client for the self-hosted aiqiezi-server photo/video archive"
repository = "https://github.com/gocpicnic/aiqiezi-gui"
build = "build.rs"

[dependencies]
aiqiezi-client = { git = "https://github.com/gocpicnic/aiqiezi-cli", rev = "477c06c9f5041f381d42b81f9ac0deccea890a72" }
anyhow = "1"
eframe = { version = "0.37", features = ["wgpu"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
